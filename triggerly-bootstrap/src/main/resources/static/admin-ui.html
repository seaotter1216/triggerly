<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Triggerly 관리자 테스트 UI</title>
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --border: #e1e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --primary: #4f6ef7;
    --primary-dark: #3a53d0;
    --danger: #e0514b;
    --ok: #1fa971;
    --warn: #d98c1a;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    white-space: nowrap;
    color: var(--primary-dark);
  }
  .tenant-box { display: flex; align-items: center; gap: 8px; }
  .tenant-box label { font-size: 12px; color: var(--muted); }
  input, select, textarea, button {
    font-family: inherit;
    font-size: 13px;
  }
  input, select, textarea {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    background: #fff;
    color: var(--text);
  }
  textarea { font-family: var(--mono); }
  button {
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: #f0f2f5; }
  button.danger { background: var(--danger); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  nav.tabs {
    width: 160px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 10px 0;
    flex-shrink: 0;
    overflow-y: auto;
  }
  nav.tabs button {
    background: none;
    color: var(--text);
    text-align: left;
    border-radius: 0;
    padding: 10px 16px;
    font-size: 13px;
  }
  nav.tabs button:hover { background: #f0f2f5; }
  nav.tabs button.active { background: #eef1ff; color: var(--primary-dark); font-weight: 600; border-left: 3px solid var(--primary); }
  .content-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  #tabContainer { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .tab-content { flex: 1; overflow-y: auto; padding: 20px; display: none; min-height: 0; }
  .tab-content.active { display: block; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; }
  .card h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: flex-start; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; flex: 1; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; background: #fafbfc; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f5f7ff; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
  }
  .badge.RUNNING, .badge.ENABLED { background: var(--primary); }
  .badge.WAITING, .badge.DRAFT { background: var(--warn); }
  .badge.COMPLETED { background: var(--ok); }
  .badge.ERROR, .badge.FAILED { background: var(--danger); }
  .badge.EXPIRED, .badge.DISABLED, .badge.ARCHIVED { background: var(--muted); }
  .kv-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .kv-row input { flex: 1; }
  .node-card, .cond-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    background: #fafbfc;
  }
  .node-card-head, .cond-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cond-card { background: #f6f7ff; }
  .cond-children { margin-left: 18px; border-left: 2px dashed var(--border); padding-left: 12px; margin-top: 8px; }
  #logPanel {
    height: 190px;
    border-top: 1px solid var(--border);
    background: #171a21;
    color: #d8dee9;
    font-family: var(--mono);
    font-size: 11.5px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #logPanel.collapsed { height: 32px; }
  #logPanel .log-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 14px;
    background: #10121a;
    flex-shrink: 0;
  }
  #logPanel .log-head span { color: #8891a7; }
  #logBody { flex: 1; overflow-y: auto; padding: 8px 14px; }
  .log-entry { margin-bottom: 6px; white-space: pre-wrap; word-break: break-all; }
  .log-entry.ok { color: #7ee6a8; }
  .log-entry.fail { color: #ff8a8a; }
  .log-entry .meta { color: #8891a7; }
  #toast {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast-item {
    padding: 10px 14px; border-radius: 8px; color: #fff; font-size: 13px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    animation: fadein .15s ease-out;
  }
  .toast-item.ok { background: var(--ok); }
  .toast-item.fail { background: var(--danger); }
  @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .empty-msg { color: var(--muted); font-size: 12.5px; padding: 10px 0; }
  .flow-preview { font-family: var(--mono); font-size: 12px; background: #fafbfc; border: 1px dashed var(--border); border-radius: 8px; padding: 10px; white-space: pre-wrap; }
  .section-actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🧪 Triggerly 관리자 테스트 UI</h1>
  <div class="tenant-box">
    <label>테넌트 ID</label>
    <input id="tenantId" placeholder="예: demo-tenant" style="width:160px" />
    <button class="secondary small" onclick="fillDemoTenant()">demo로 채우기</button>
  </div>
  <div class="hint">※ 모든 탭이 이 테넌트 ID를 공유합니다. 아래 "요청 로그"에서 모든 API 호출 내역을 확인할 수 있습니다.</div>
</header>

<main>
  <nav class="tabs" id="tabNav"></nav>
  <div class="content-wrap">
    <div id="tabContainer"></div>
    <div id="logPanel">
      <div class="log-head">
        <span id="logSummary">요청 로그 (0건)</span>
        <div>
          <button class="secondary small" onclick="clearLog()">지우기</button>
          <button class="secondary small" onclick="toggleLog()" id="logToggleBtn">접기</button>
        </div>
      </div>
      <div id="logBody"></div>
    </div>
  </div>
</main>

<div id="toast"></div>
<datalist id="fieldSuggestions"></datalist>

<script>
/* ============================= 공통 유틸 ============================= */

const state = {
  eventDefinitions: [],
  attributeDefinitions: [],
  members: [],
  workflows: [],
  instances: [],
  selectedInstanceId: null,
  pollTimer: null,
  draftWorkflow: null, // { id, name, triggerEventCode, nodes:[], edges:[] }
  customFieldKeys: [], // 이벤트 발행/회원 attributes 탭에 방금 입력한 key들 (syncCustomFieldKeys가 채움)
};

function $(id) { return document.getElementById(id); }
function uuid() {
  return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  }));
}
function tenantId() { return $('tenantId').value.trim(); }
function requireTenant() {
  const t = tenantId();
  if (!t) { toast('먼저 상단에 테넌트 ID를 입력하세요.', 'fail'); throw new Error('tenantId missing'); }
  return t;
}
function fillDemoTenant() {
  $('tenantId').value = 'demo-tenant';
  saveTenant();
}
function saveTenant() {
  try { localStorage.setItem('triggerly.tenantId', $('tenantId').value); } catch (e) {}
}
(function restoreTenant() {
  try {
    const saved = localStorage.getItem('triggerly.tenantId');
    if (saved) $('tenantId').value = saved;
  } catch (e) {}
})();

function toast(message, type) {
  const el = document.createElement('div');
  el.className = 'toast-item ' + (type || 'ok');
  el.textContent = message;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

let logCount = 0;
function appendLog(method, url, status, ok, reqBody, resBody) {
  logCount++;
  $('logSummary').textContent = `요청 로그 (${logCount}건)`;
  const line = document.createElement('div');
  line.className = 'log-entry ' + (ok ? 'ok' : 'fail');
  const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  const reqStr = reqBody ? ` req=${JSON.stringify(reqBody)}` : '';
  const resStr = resBody !== undefined ? ` res=${typeof resBody === 'string' ? resBody : JSON.stringify(resBody)}` : '';
  line.innerHTML = `<span class="meta">[${time}]</span> ${method} ${url} → <b>${status}</b>${escapeHtml(reqStr)}${escapeHtml(resStr)}`;
  $('logBody').appendChild(line);
  $('logBody').scrollTop = $('logBody').scrollHeight;
}
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function clearLog() { $('logBody').innerHTML = ''; logCount = 0; $('logSummary').textContent = '요청 로그 (0건)'; }
function toggleLog() {
  const panel = $('logPanel');
  panel.classList.toggle('collapsed');
  $('logToggleBtn').textContent = panel.classList.contains('collapsed') ? '펼치기' : '접기';
}

// 모든 API 호출은 이 함수를 거친다: 로그 패널에 기록 + 실패 시 toast로 바로 알림.
async function request(method, url, body) {
  let res, text, data;
  try {
    res = await fetch(url, {
      method,
      headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    appendLog(method, url, 'NETWORK_ERROR', false, body, String(networkErr));
    toast(`네트워크 오류: ${url} 에 연결할 수 없습니다 (서버가 떠 있는지 확인하세요)`, 'fail');
    throw networkErr;
  }
  text = await res.text();
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }

  appendLog(method, url, res.status, res.ok, body, data);
  if (!res.ok) {
    const message = (data && data.message) || (data && data.error) || text || `HTTP ${res.status}`;
    toast(`요청 실패 (${res.status}): ${message}`, 'fail');
    const err = new Error(message);
    err.status = res.status;
    err.body = data;
    throw err;
  }
  return data;
}

function qs(params) {
  const usp = new URLSearchParams();
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '') usp.set(k, v); });
  return usp.toString();
}

/* ============================= 탭 구조 ============================= */

const TABS = [
  { id: 'eventDef', label: '1. 이벤트 정의' },
  { id: 'attrDef', label: '2. 속성 정의' },
  { id: 'member', label: '3. 회원' },
  { id: 'workflow', label: '4. 워크플로우' },
  { id: 'publish', label: '5. 이벤트 발행' },
  { id: 'instance', label: '6. 인스턴스 탐색' },
];

function renderTabsNav() {
  const nav = $('tabNav');
  nav.innerHTML = '';
  TABS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.id = 'navbtn-' + t.id;
    btn.onclick = () => switchTab(t.id);
    nav.appendChild(btn);
  });
}

function switchTab(id) {
  TABS.forEach(t => {
    $('navbtn-' + t.id).classList.toggle('active', t.id === id);
    $('tab-' + t.id).classList.toggle('active', t.id === id);
  });
  if (id === 'instance') startPolling(); else stopPolling();
}

/* ============================= 1. 이벤트 정의 ============================= */

function renderEventDefTab() {
  return `
  <div class="card">
    <h2>이벤트 정의 등록</h2>
    <div class="hint">워크플로우가 반응할 이벤트 코드를 먼저 등록해야, 뒤의 워크플로우/속성 정의/이벤트 발행 탭에서 선택할 수 있습니다.</div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>이벤트 코드 (영문 대문자 권장)</label><input id="ed_code" placeholder="예: CART_ADD" /></div>
      <div class="field"><label>표시 이름</label><input id="ed_name" placeholder="예: 장바구니 담기" /></div>
    </div>
    <button onclick="registerEventDefinition()">등록</button>
  </div>
  <div class="card">
    <div class="section-actions"><h2 style="margin:0">등록된 이벤트 정의</h2><button class="secondary small" onclick="loadEventDefinitions()">새로고침</button></div>
    <div id="ed_list"></div>
  </div>`;
}

async function registerEventDefinition() {
  const t = requireTenant();
  const code = $('ed_code').value.trim();
  const displayName = $('ed_name').value.trim();
  if (!code || !displayName) return toast('이벤트 코드와 표시 이름을 모두 입력하세요.', 'fail');
  await request('POST', '/api/v1/admin/event-definitions', { tenantId: t, code, displayName });
  toast(`이벤트 정의 "${code}" 등록 완료`, 'ok');
  $('ed_code').value = ''; $('ed_name').value = '';
  await loadEventDefinitions();
}

async function loadEventDefinitions() {
  const t = tenantId();
  if (!t) return;
  state.eventDefinitions = await request('GET', `/api/v1/admin/event-definitions?${qs({ tenantId: t })}`);
  const box = $('ed_list');
  if (!state.eventDefinitions.length) { box.innerHTML = '<div class="empty-msg">등록된 이벤트 정의가 없습니다.</div>'; }
  else {
    box.innerHTML = `<table><thead><tr><th>코드</th><th>표시 이름</th><th>ID</th><th>생성일시</th></tr></thead><tbody>
      ${state.eventDefinitions.map(e => `<tr><td>${escapeHtml(e.code)}</td><td>${escapeHtml(e.displayName)}</td><td>${escapeHtml(e.id)}</td><td>${escapeHtml(e.createdAt || '')}</td></tr>`).join('')}
    </tbody></table>`;
  }
  refreshEventCodeDropdowns();
}

function refreshEventCodeDropdowns() {
  document.querySelectorAll('.event-code-select').forEach(sel => {
    const current = sel.value;
    sel.innerHTML = '<option value="">-- 이벤트 코드 선택 --</option>' +
      state.eventDefinitions.map(e => `<option value="${escapeHtml(e.code)}">${escapeHtml(e.code)} (${escapeHtml(e.displayName)})</option>`).join('');
    if (current) sel.value = current;
  });
  refreshFieldSuggestions();
}

// CONDITION/WAIT_FOR_EVENT 노드의 field 입력창에서 자동완성으로 보여줄 후보들.
// IngestEventUseCase.buildContext()가 실제로 만드는 컨텍스트 맵의 key와 1:1로 맞춘 것 - 이 접두사
// 규칙(event.* / member.*)은 API 어디에도 문서화돼 있지 않아서, 후보를 미리 보여주지 않으면 사용자가
// 맨땅에 틀린 key를 입력하고도 "조건이 항상 false"로 조용히 실패하는 원인을 찾기 어렵다.
function refreshFieldSuggestions() {
  const list = $('fieldSuggestions');
  const staticFields = [
    ['event.eventCode', '이벤트 코드'],
    ['event.occurredAt', '이벤트 발생 시각'],
    ['member.id', '회원 ID'],
    ['member.email', '회원 이메일'],
    ['member.telephone', '회원 전화번호'],
    ['member.devicePlatform', '회원 기기 플랫폼 (ANDROID/IOS/WEB)'],
    ['member.gender', '회원 성별 (MALE/FEMALE)'],
    ['member.birthday', '회원 생년월일'],
    ['member.status', '회원 상태 (ACTIVE/WITHDRAWN/DORMANT/BLOCKED)'],
    ['member.isBirthdayToday', '오늘이 생일인지 (true/false)'],
    ['member.attributes.<key>', '회원 등록 시 넣은 커스텀 속성'],
    ['stats.eventCount:<CODE>:<N>d', '최근 N일간 CODE 이벤트 발생 횟수'],
  ];
  const eventAttrFields = state.attributeDefinitions.map(a => [`event.${a.key}`, `속성 정의: ${a.displayName}`]);
  const seen = new Set();
  const all = [...staticFields, ...eventAttrFields, ...state.customFieldKeys].filter(([value]) => {
    if (seen.has(value)) return false;
    seen.add(value);
    return true;
  });
  list.innerHTML = all
    .map(([value, label]) => `<option value="${escapeHtml(value)}" label="${escapeHtml(label)}"></option>`)
    .join('');
}

/* ============================= 2. 속성 정의 ============================= */

function renderAttrDefTab() {
  return `
  <div class="card">
    <h2>속성 정의 등록</h2>
    <div class="hint">이벤트와 함께 전달되는 attributes(또는 회원 attributes)의 스키마를 등록합니다. 워크플로우의 조건식에서 field로 참조할 key를 여기서 정의하세요.</div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>연결할 이벤트 정의 (선택)</label><select id="ad_eventDefId" class="event-def-select"></select></div>
      <div class="field"><label>Key</label><input id="ad_key" placeholder="예: cartItemCount" /></div>
      <div class="field"><label>표시 이름</label><input id="ad_name" placeholder="예: 장바구니 상품 수" /></div>
      <div class="field"><label>타입</label>
        <select id="ad_type">
          <option>STRING</option><option>LONG</option><option>DOUBLE</option><option>BIG_DECIMAL</option><option>BOOLEAN</option><option>DATE</option>
        </select>
      </div>
      <div class="field" style="flex:0 0 auto"><label>필터 가능</label><input type="checkbox" id="ad_filterable" /></div>
    </div>
    <button onclick="registerAttributeDefinition()">등록</button>
  </div>
  <div class="card">
    <div class="section-actions"><h2 style="margin:0">등록된 속성 정의</h2><button class="secondary small" onclick="loadAttributeDefinitions()">새로고침</button></div>
    <div id="ad_list"></div>
  </div>`;
}

function refreshEventDefSelects() {
  document.querySelectorAll('.event-def-select').forEach(sel => {
    const current = sel.value;
    sel.innerHTML = '<option value="">(연결 안 함)</option>' +
      state.eventDefinitions.map(e => `<option value="${escapeHtml(e.id)}">${escapeHtml(e.code)} (${escapeHtml(e.displayName)})</option>`).join('');
    if (current) sel.value = current;
  });
}

async function registerAttributeDefinition() {
  const t = requireTenant();
  const key = $('ad_key').value.trim();
  const displayName = $('ad_name').value.trim();
  if (!key || !displayName) return toast('key와 표시 이름을 입력하세요.', 'fail');
  await request('POST', '/api/v1/admin/attribute-definitions', {
    tenantId: t,
    eventDefinitionId: $('ad_eventDefId').value || null,
    key, displayName,
    type: $('ad_type').value,
    filterable: $('ad_filterable').checked,
  });
  toast(`속성 정의 "${key}" 등록 완료`, 'ok');
  $('ad_key').value = ''; $('ad_name').value = ''; $('ad_filterable').checked = false;
  await loadAttributeDefinitions();
}

async function loadAttributeDefinitions() {
  const t = tenantId();
  if (!t) return;
  state.attributeDefinitions = await request('GET', `/api/v1/admin/attribute-definitions?${qs({ tenantId: t })}`);
  const box = $('ad_list');
  if (!state.attributeDefinitions.length) { box.innerHTML = '<div class="empty-msg">등록된 속성 정의가 없습니다.</div>'; }
  else {
    box.innerHTML = `<table><thead><tr><th>Key</th><th>표시 이름</th><th>타입</th><th>필터 가능</th><th>연결된 이벤트 정의 ID</th></tr></thead><tbody>
      ${state.attributeDefinitions.map(a => `<tr><td>${escapeHtml(a.key)}</td><td>${escapeHtml(a.displayName)}</td><td>${escapeHtml(a.type)}</td><td>${a.filterable ? 'O' : '-'}</td><td class="muted">${escapeHtml(a.eventDefinitionId || '-')}</td></tr>`).join('')}
    </tbody></table>`;
  }
  refreshFieldSuggestions();
}

// attributes를 field 접두사로 변환하는 규칙(IngestEventUseCase.buildContext 참고): 어느 탭에서
// 입력한 key냐에 따라 condition 빌더의 field 이름이 달라진다 - 이벤트 발행 탭(pub_attrs)은
// "event.<key>", 회원 attributes(mb_attrs)는 "member.attributes.<key>".
const KV_CONTAINER_FIELD_PREFIX = { pub_attrs: 'event.', mb_attrs: 'member.attributes.' };

function addKvRow(containerId, key, value) {
  const container = $(containerId);
  const row = document.createElement('div');
  row.className = 'kv-row';
  row.innerHTML = `<input placeholder="key" class="kv-key" value="${escapeHtml(key || '')}" />
    <input placeholder="value" class="kv-value" value="${escapeHtml(value || '')}" />
    <button class="secondary small" onclick="this.parentElement.remove(); syncCustomFieldKeys()">삭제</button>`;
  container.appendChild(row);
  const prefix = KV_CONTAINER_FIELD_PREFIX[containerId];
  if (prefix) {
    const keyInput = row.querySelector('.kv-key');
    keyInput.addEventListener('input', syncCustomFieldKeys);
    // 조건 노드의 field 입력창(event.*/member.* 접두사 필수)과 헷갈려서 여기에도 접두사를 붙여 적는
    // 실수가 실제로 있었다 - 여긴 bare key만 받고 접두사는 서버 쪽에서 자동으로 붙이므로, 그대로 두면
    // "event.member.devicePlatform" 같은 의미 없는 키가 조용히 생겨서 조건이 영원히 매칭 안 된다.
    keyInput.addEventListener('change', () => warnIfMisplacedPrefix(keyInput.value, prefix));
  }
}

function warnIfMisplacedPrefix(key, prefix) {
  if (/^(event|member)\./.test(key)) {
    toast(`"${key}" — 여긴 접두사 없이 키 이름만 적으세요 (자동으로 "${prefix}"가 붙습니다).`, 'fail');
  }
}

// 등록된 속성 정의가 없어도, 사용자가 이벤트 발행/회원 attributes 탭에 지금 막 입력해 둔 key를
// condition 빌더의 field 자동완성 후보로 즉시 반영한다 (예: 속성 정의 없이 바로 category/productId를
// 이벤트 발행 탭에 넣고 워크플로우 조건에서 쓰려는 경우).
function syncCustomFieldKeys() {
  state.customFieldKeys = [];
  Object.entries(KV_CONTAINER_FIELD_PREFIX).forEach(([containerId, prefix]) => {
    const container = $(containerId);
    if (!container) return;
    container.querySelectorAll('.kv-key').forEach(input => {
      const key = input.value.trim();
      if (key) state.customFieldKeys.push([`${prefix}${key}`, '방금 입력한 attributes key']);
    });
  });
  refreshFieldSuggestions();
}
function readKvRows(containerId) {
  const result = {};
  $(containerId).querySelectorAll('.kv-row').forEach(row => {
    const k = row.querySelector('.kv-key').value.trim();
    const v = row.querySelector('.kv-value').value.trim();
    if (k) result[k] = v;
  });
  return result;
}

async function registerMember() {
  const t = requireTenant();
  const id = $('mb_id').value.trim();
  const externalMemberId = $('mb_externalId').value.trim();
  if (!id || !externalMemberId) return toast('회원 ID와 외부 회원 ID는 필수입니다.', 'fail');
  await request('POST', '/api/v1/admin/members', {
    id, tenantId: t, externalMemberId,
    name: $('mb_name').value.trim() || null,
    email: $('mb_email').value.trim() || null,
    telephone: $('mb_tel').value.trim() || null,
    devicePlatform: $('mb_platform').value || null,
    gender: $('mb_gender').value || null,
    birthday: $('mb_birthday').value || null,
    attributes: readKvRows('mb_attrs'),
  });
  toast(`회원 "${externalMemberId}" 등록 완료`, 'ok');
}

async function searchMembers() {
  const t = requireTenant();
  const criteria = readKvRows('mb_search_criteria');
  state.members = await request('GET', `/api/v1/admin/members/search?${qs({ tenantId: t, ...criteria })}`);
  const box = $('mb_search_result');
  if (!state.members.length) { box.innerHTML = '<div class="empty-msg">검색 결과가 없습니다.</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>ID</th><th>외부ID</th><th>이름</th><th>이메일</th><th>상태</th></tr></thead><tbody>
    ${state.members.map(m => `<tr><td>${escapeHtml(m.id)}</td><td>${escapeHtml(m.externalMemberId)}</td><td>${escapeHtml(m.name || '-')}</td><td>${escapeHtml(m.email || '-')}</td><td>${m.status ? `<span class="badge ${m.status}">${m.status}</span>` : '-'}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ============================= 4. 워크플로우 ============================= */

function newDraftWorkflow() {
  const triggerId = 'n-' + uuid().slice(0, 8);
  const endId = 'n-' + uuid().slice(0, 8);
  return {
    id: 'wf-' + uuid().slice(0, 8),
    name: '',
    triggerEventCode: '',
    // edges는 더 이상 따로 관리하지 않는다 - 각 노드 카드 안의 "다음 노드" 선택(n.nextAlways/nextTrue/...)이
    // 유일한 출처이고, computeEdges()가 저장 시점에 이걸로부터 파생시킨다. END 노드를 기본으로 하나
    // 넣어두는 이유: "노드만 만들고 END/엣지를 안 만들어서 인스턴스가 RUNNING에서 멈추는" 버그가 실제로
    // 발생했었다(2026-10-11) - 처음부터 종료 지점을 강제해서 같은 실수를 구조적으로 막는다.
    nodes: [{ id: triggerId, type: 'TRIGGER', eventCode: '' }, { id: endId, type: 'END' }],
  };
}

function renderWorkflowTab() {
  if (!state.draftWorkflow) state.draftWorkflow = newDraftWorkflow();
  return `
  <div class="card">
    <h2>새 워크플로우 만들기</h2>
    <div class="hint">각 노드 카드 안에서 바로 "다음 노드"를 지정하세요 (조건 노드는 참/거짓 분기를 각각 따로 지정합니다). 저장 시 서버에서 추가로 검증합니다: 모든 엣지가 실제 존재하는 노드를 가리킴, 순환(cycle) 없음.</div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>워크플로우 ID <button class="secondary small" onclick="$('wf_id').value=uuid();state.draftWorkflow.id=$('wf_id').value">자동생성</button></label><input id="wf_id" value="${escapeHtml(state.draftWorkflow.id)}" onchange="state.draftWorkflow.id=this.value" /></div>
      <div class="field"><label>이름</label><input id="wf_name" value="${escapeHtml(state.draftWorkflow.name)}" onchange="state.draftWorkflow.name=this.value" /></div>
      <div class="field"><label>트리거 이벤트 코드</label><select id="wf_triggerCode" class="event-code-select" onchange="onTriggerEventCodeChange(this.value)"></select></div>
    </div>

    <h3>노드 (${state.draftWorkflow.nodes.length}개)</h3>
    <div id="wf_nodes"></div>
    <button class="secondary small" onclick="addNode()">+ 노드 추가</button>

    <h3 style="margin-top:16px">흐름 미리보기</h3>
    <div class="flow-preview" id="wf_preview"></div>

    <div style="margin-top:14px; display:flex; gap:8px">
      <button onclick="saveWorkflow()">워크플로우 저장</button>
      <button class="secondary" onclick="state.draftWorkflow=newDraftWorkflow(); renderCurrentTab()">새로 시작</button>
    </div>
  </div>
  <div class="card">
    <div class="section-actions"><h2 style="margin:0">등록된 워크플로우</h2><button class="secondary small" onclick="loadWorkflows()">새로고침</button></div>
    <div id="wf_list"></div>
  </div>`;
}

function onTriggerEventCodeChange(code) {
  state.draftWorkflow.triggerEventCode = code;
  const trigger = state.draftWorkflow.nodes.find(n => n.type === 'TRIGGER');
  if (trigger) trigger.eventCode = code;
  renderWorkflowNodesAndEdges();
}

function nodeLabel(n) {
  const extra = n.type === 'TRIGGER' ? (n.eventCode || '(이벤트 미선택)')
    : n.type === 'ACTION' ? (n.actionType || '')
    : n.type === 'WAIT_FOR_EVENT' ? (n.eventCode || '(이벤트 미선택)')
    : n.type === 'DELAY' ? `${n.durationValue || '?'}${n.durationUnit || ''}`
    : '';
  return `${n.id} [${n.type}${extra ? ': ' + extra : ''}]`;
}

function addNode() {
  state.draftWorkflow.nodes.push({ id: 'n-' + uuid().slice(0, 8), type: 'ACTION', actionType: 'ISSUE_COUPON', couponId: '' });
  renderWorkflowNodesAndEdges();
}
const NEXT_POINTER_KEYS = ['nextAlways', 'nextTrue', 'nextFalse', 'nextMatched', 'nextTimeout'];

function removeNode(id) {
  const wf = state.draftWorkflow;
  const n = wf.nodes.find(x => x.id === id);
  if (n && n.type === 'TRIGGER') return toast('TRIGGER 노드는 삭제할 수 없습니다 (워크플로우당 정확히 1개 필요).', 'fail');
  if (n && n.type === 'END' && wf.nodes.filter(x => x.type === 'END').length <= 1) {
    return toast('END 노드는 최소 1개 있어야 합니다.', 'fail');
  }
  wf.nodes = wf.nodes.filter(x => x.id !== id);
  // 삭제된 노드를 가리키던 다음-노드 포인터가 남아있으면 저장 시 존재하지 않는 노드를 가리키는 엣지가
  // 되므로, 다른 노드들에서 이 id를 참조하던 포인터를 전부 비워서 재선택을 강제한다.
  wf.nodes.forEach(x => NEXT_POINTER_KEYS.forEach(key => { if (x[key] === id) x[key] = ''; }));
  renderWorkflowNodesAndEdges();
}

function emptyCondition() { return { type: 'PREDICATE', field: '', operator: 'EQ', value: '' }; }

function renderCondition(cond, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'cond-card';
  const head = document.createElement('div');
  head.className = 'cond-card-head';
  const typeSel = document.createElement('select');
  ['PREDICATE', 'AND', 'OR', 'NOT'].forEach(t => {
    const o = document.createElement('option'); o.value = t; o.textContent = t; if (t === cond.type) o.selected = true;
    typeSel.appendChild(o);
  });
  typeSel.onchange = () => {
    cond.type = typeSel.value;
    if (cond.type === 'PREDICATE') { Object.assign(cond, { field: '', operator: 'EQ', value: '' }); delete cond.conditions; delete cond.condition; }
    else if (cond.type === 'AND' || cond.type === 'OR') { cond.conditions = cond.conditions || []; delete cond.field; delete cond.operator; delete cond.value; delete cond.condition; }
    else if (cond.type === 'NOT') { cond.condition = cond.condition || emptyCondition(); delete cond.field; delete cond.operator; delete cond.value; delete cond.conditions; }
    onChange();
  };
  head.appendChild(typeSel);
  wrap.appendChild(head);

  if (cond.type === 'PREDICATE') {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="field"><label>field <span class="hint" style="margin:0">(event.* / member.* 접두사 필수)</span></label><input class="p-field" list="fieldSuggestions" placeholder="예: event.cartItemCount, member.gender" /></div>
      <div class="field"><label>operator</label><select class="p-op">${['EQ','NE','GT','GOE','LT','LOE','IN','NOT_IN','EXISTS'].map(o => `<option ${o===cond.operator?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field p-value-field"><label>value ${(cond.operator==='IN'||cond.operator==='NOT_IN') ? '(콤마로 구분)' : ''}</label><input class="p-value" /></div>
    `;
    const fieldInput = row.querySelector('.p-field');
    const opSel = row.querySelector('.p-op');
    const valueField = row.querySelector('.p-value-field');
    const valueInput = row.querySelector('.p-value');
    fieldInput.value = cond.field || '';
    valueInput.value = Array.isArray(cond.value) ? cond.value.join(',') : (cond.value ?? '');
    function syncValueVisibility() { valueField.style.display = opSel.value === 'EXISTS' ? 'none' : ''; }
    syncValueVisibility();
    fieldInput.oninput = () => { cond.field = fieldInput.value; };
    opSel.onchange = () => { cond.operator = opSel.value; syncValueVisibility(); };
    valueInput.oninput = () => {
      if (opSel.value === 'IN' || opSel.value === 'NOT_IN') cond.value = valueInput.value.split(',').map(s => s.trim()).filter(Boolean);
      else cond.value = valueInput.value;
    };
    wrap.appendChild(row);
  } else if (cond.type === 'AND' || cond.type === 'OR') {
    const childrenBox = document.createElement('div');
    childrenBox.className = 'cond-children';
    function renderChildren() {
      childrenBox.innerHTML = '';
      cond.conditions.forEach((child, idx) => {
        const childWrap = renderCondition(child, onChange);
        const delBtn = document.createElement('button');
        delBtn.className = 'secondary small'; delBtn.textContent = '이 조건 삭제'; delBtn.style.marginBottom = '6px';
        delBtn.onclick = () => { cond.conditions.splice(idx, 1); renderChildren(); };
        childrenBox.appendChild(childWrap);
        childrenBox.appendChild(delBtn);
      });
      const addBtn = document.createElement('button');
      addBtn.className = 'secondary small'; addBtn.textContent = '+ 하위 조건 추가';
      addBtn.onclick = () => { cond.conditions.push(emptyCondition()); renderChildren(); };
      childrenBox.appendChild(addBtn);
    }
    renderChildren();
    wrap.appendChild(childrenBox);
  } else if (cond.type === 'NOT') {
    const childrenBox = document.createElement('div');
    childrenBox.className = 'cond-children';
    childrenBox.appendChild(renderCondition(cond.condition, onChange));
    wrap.appendChild(childrenBox);
  }
  return wrap;
}

function renderWorkflowNodesAndEdges() {
  const wf = state.draftWorkflow;
  const endCount = wf.nodes.filter(x => x.type === 'END').length;
  const nodesBox = $('wf_nodes');
  nodesBox.innerHTML = '';
  wf.nodes.forEach(n => {
    const card = document.createElement('div');
    card.className = 'node-card';
    const head = document.createElement('div');
    head.className = 'node-card-head';
    head.innerHTML = `<b>${escapeHtml(n.id)}</b>`;
    const typeSel = document.createElement('select');
    ['TRIGGER','CONDITION','ACTION','WAIT_FOR_EVENT','DELAY','END'].forEach(t => {
      const o = document.createElement('option'); o.value = t; o.textContent = t;
      if (t === n.type) o.selected = true;
      if (t === 'TRIGGER' && n.type !== 'TRIGGER') o.disabled = true; // 트리거는 1개로 고정, 다른 노드를 트리거로 바꾸지 못하게 막음
      typeSel.appendChild(o);
    });
    const isLastEnd = n.type === 'END' && endCount <= 1;
    typeSel.disabled = (n.type === 'TRIGGER') || isLastEnd;
    typeSel.title = isLastEnd ? 'END 노드가 최소 1개는 있어야 해서 타입을 바꿀 수 없습니다' : '';
    typeSel.onchange = () => { convertNodeType(n, typeSel.value); renderWorkflowNodesAndEdges(); };
    head.appendChild(typeSel);
    if (n.type !== 'TRIGGER' && !isLastEnd) {
      const delBtn = document.createElement('button');
      delBtn.className = 'secondary small'; delBtn.textContent = '삭제';
      delBtn.onclick = () => removeNode(n.id);
      head.appendChild(delBtn);
    }
    card.appendChild(head);
    card.appendChild(renderNodeFields(n));
    if (n.type !== 'END') card.appendChild(renderNextPointers(n));
    nodesBox.appendChild(card);
  });

  renderFlowPreview();
}

// CONDITION 노드처럼 "다음 노드"가 분기되는 타입은 이 노드 카드 안에서 바로 분기별 목표 노드를
// 선택하게 한다 - 예전엔 별도 "엣지" 목록에서 from/to id를 수동으로 맞춰야 했는데, 그 분리된 구조가
// 바로 "조건 노드마다 참/거짓 목적지를 못 정하는 것처럼 보인다"는 혼란 + "다음 노드 지정을 깜빡해서
// 인스턴스가 멈추는" 버그의 원인이었다. TRIGGER로는 되돌아갈 수 없게(순환 방지) 대상에서 제외한다.
function candidateTargets(n) {
  return state.draftWorkflow.nodes.filter(x => x.id !== n.id && x.type !== 'TRIGGER');
}

function renderNextPointers(n) {
  const box = document.createElement('div');
  box.style.marginTop = '10px';
  box.style.borderTop = '1px dashed var(--border)';
  box.style.paddingTop = '10px';
  const targets = candidateTargets(n);

  function makeSelect(labelText, propName) {
    const field = document.createElement('div');
    field.className = 'field';
    field.style.marginBottom = '8px';
    const label = document.createElement('label');
    label.textContent = labelText;
    const select = document.createElement('select');
    select.appendChild(new Option('-- 다음 노드 선택 --', ''));
    targets.forEach(t => select.appendChild(new Option(nodeLabel(t), t.id, false, t.id === n[propName])));
    select.onchange = () => { n[propName] = select.value; renderFlowPreview(); };
    field.appendChild(label); field.appendChild(select);
    return field;
  }

  if (n.type === 'TRIGGER' || n.type === 'ACTION' || n.type === 'DELAY') {
    box.appendChild(makeSelect('다음 노드 (항상 이동) *', 'nextAlways'));
  } else if (n.type === 'CONDITION') {
    box.appendChild(makeSelect('조건이 참(TRUE)이면 → *', 'nextTrue'));
    box.appendChild(makeSelect('조건이 거짓(FALSE)이면 → *', 'nextFalse'));
  } else if (n.type === 'WAIT_FOR_EVENT') {
    box.appendChild(makeSelect('이벤트가 매칭되면(MATCHED) → *', 'nextMatched'));
    box.appendChild(makeSelect('타임아웃되면(TIMEOUT) → (타임아웃 값 비우면 이 선택은 무시됨)', 'nextTimeout'));
  }
  return box;
}

function convertNodeType(n, newType) {
  const id = n.id;
  Object.keys(n).forEach(k => { if (k !== 'id' && k !== 'type') delete n[k]; });
  n.type = newType;
  if (newType === 'ACTION') Object.assign(n, { actionType: 'ISSUE_COUPON', couponId: '' });
  else if (newType === 'WAIT_FOR_EVENT') Object.assign(n, { eventCode: '', timeoutValue: '', timeoutUnit: 'HOURS', condition: null });
  else if (newType === 'DELAY') Object.assign(n, { durationValue: '', durationUnit: 'MINUTES' });
  else if (newType === 'CONDITION') Object.assign(n, { condition: emptyCondition() });
}

function renderNodeFields(n) {
  const box = document.createElement('div');
  if (n.type === 'TRIGGER') {
    box.innerHTML = `<div class="hint">상단 "트리거 이벤트 코드" 선택과 동일하게 자동 반영됩니다. 현재: <b>${escapeHtml(n.eventCode || '(미선택)')}</b></div>`;
  } else if (n.type === 'END') {
    box.innerHTML = `<div class="hint">종료 노드 — 추가 필드가 없습니다.</div>`;
  } else if (n.type === 'DELAY') {

      <div class="field"><label>대기 시간</label><input class="n-durValue" type="number" value="${n.durationValue ?? ''}" /></div>
      <div class="field"><label>단위</label><select class="n-durUnit">${['SECONDS','MINUTES','HOURS','DAYS'].map(u => `<option ${u===n.durationUnit?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>`;
    box.querySelector('.n-durValue').oninput = function () { n.durationValue = this.value; };
    box.querySelector('.n-durUnit').onchange = function () { n.durationUnit = this.value; };
  } else if (n.type === 'ACTION') {
    box.innerHTML = `<div class="row">

        <option value="ISSUE_COUPON" ${n.actionType==='ISSUE_COUPON'?'selected':''}>쿠폰 발급 (ISSUE_COUPON)</option>
        <option value="SEND_PUSH" ${n.actionType==='SEND_PUSH'?'selected':''}>푸시 발송 (SEND_PUSH)</option>
        <option value="SEND_ALIM_TALK" ${n.actionType==='SEND_ALIM_TALK'?'selected':''}>알림톡 발송 (SEND_ALIM_TALK)</option>
      </select></div>
      <div class="field n-action-param-field"><label class="n-action-param-label"></label><input class="n-action-param" /></div>
    </div>`;
    const paramLabel = box.querySelector('.n-action-param-label');
    const paramInput = box.querySelector('.n-action-param');
    function syncParamField() {
      if (n.actionType === 'ISSUE_COUPON') { paramLabel.textContent = 'couponId'; paramInput.value = n.couponId || ''; }
      else { paramLabel.textContent = 'templateId'; paramInput.value = n.templateId || ''; }
    }

      else { delete n.couponId; n.templateId = n.templateId || ''; }
      syncParamField();
    };
    paramInput.oninput = function () {
      if (n.actionType === 'ISSUE_COUPON') n.couponId = this.value; else n.templateId = this.value;
    };
  } else if (n.type === 'WAIT_FOR_EVENT') {
    box.innerHTML = `<div class="row">
      <div class="field"><label>기다릴 이벤트 코드</label><select class="n-waitCode event-code-select"></select></div>
      <div class="field"><label>타임아웃 (선택)</label><input class="n-timeoutValue" type="number" value="${n.timeoutValue ?? ''}" /></div>
      <div class="field"><label>타임아웃 단위</label><select class="n-timeoutUnit">${['SECONDS','MINUTES','HOURS','DAYS'].map(u => `<option ${u===n.timeoutUnit?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div class="row"><div class="field" style="flex:0 0 auto"><label><input type="checkbox" class="n-hasMatch" ${n.condition?'checked':''}/> 매칭 조건 사용</label></div></div>
    <div class="n-match-box"></div>`;
    refreshEventCodeDropdowns();
    box.querySelector('.n-waitCode').value = n.eventCode || '';
    box.querySelector('.n-waitCode').onchange = function () { n.eventCode = this.value; };
    box.querySelector('.n-timeoutValue').oninput = function () { n.timeoutValue = this.value; };
    box.querySelector('.n-timeoutUnit').onchange = function () { n.timeoutUnit = this.value; };
    const matchBox = box.querySelector('.n-match-box');
    function syncMatchBox() {
      matchBox.innerHTML = '';
      if (n.condition) matchBox.appendChild(renderCondition(n.condition, () => {}));
    }
    syncMatchBox();
    box.querySelector('.n-hasMatch').onchange = function () {
      n.condition = this.checked ? emptyCondition() : null;
      syncMatchBox();
    };
  } else if (n.type === 'CONDITION') {
    box.appendChild(renderCondition(n.condition, () => renderWorkflowNodesAndEdges()));
  }
  return box;
}

function conditionToText(c) {
  if (!c) return '(none)';
  if (c.type === 'PREDICATE') return `${c.field} ${c.operator} ${Array.isArray(c.value) ? '[' + c.value.join(',') + ']' : (c.value ?? '')}`;
  if (c.type === 'NOT') return `NOT(${conditionToText(c.condition)})`;
  return `${c.type}(${(c.conditions || []).map(conditionToText).join(', ')})`;
}

// 각 노드의 "다음 노드" 선택(n.nextAlways/nextTrue/nextFalse/nextMatched/nextTimeout)으로부터
// 실제 엣지 목록을 파생시킨다 - 이게 유일한 출처이고, 더 이상 별도로 edges 배열을 관리하지 않는다.
// nextTimeout은 timeoutValue가 실제로 설정돼 있을 때만 엣지로 반영한다(타임아웃을 안 쓰는 WAIT_FOR_EVENT
// 노드에서 nextTimeout을 미리 골라놔도 무시됨).
function computeEdges(wf) {
  const edges = [];
  wf.nodes.forEach(n => {
    if (n.type === 'TRIGGER' || n.type === 'ACTION' || n.type === 'DELAY') {
      if (n.nextAlways) edges.push({ from: n.id, to: n.nextAlways, route: 'ALWAYS' });
    } else if (n.type === 'CONDITION') {
      if (n.nextTrue) edges.push({ from: n.id, to: n.nextTrue, route: 'TRUE' });
      if (n.nextFalse) edges.push({ from: n.id, to: n.nextFalse, route: 'FALSE' });
    } else if (n.type === 'WAIT_FOR_EVENT') {
      if (n.nextMatched) edges.push({ from: n.id, to: n.nextMatched, route: 'MATCHED' });
      if (n.timeoutValue && n.nextTimeout) edges.push({ from: n.id, to: n.nextTimeout, route: 'TIMEOUT' });
    }
  });
  return edges;
}

// 저장 전 체크: END 노드를 벗어나는 모든 노드는 자신의 라우트에 맞는 "다음 노드"가 전부 채워져 있어야
// 한다. 비워진 채로 저장하면 WorkflowEngine.runFrom()이 그 라우트를 타는 순간
// "노드 X에서 Y로 가는 엣지가 없습니다" 예외로 죽고, 인스턴스가 RUNNING에 멈춘 채 복구 불가능해진다
// (2026-10-11에 실제로 겪은 버그) - 그래서 그 상태가 되기 전에 막는다.
function validateGraphComplete(wf) {
  const errors = [];
  wf.nodes.forEach(n => {
    if (n.type === 'TRIGGER' || n.type === 'ACTION' || n.type === 'DELAY') {
      if (!n.nextAlways) errors.push(`[${n.id}] 다음 노드를 지정하세요`);
    } else if (n.type === 'CONDITION') {
      if (!n.nextTrue) errors.push(`[${n.id}] 참(TRUE)일 때 다음 노드를 지정하세요`);
      if (!n.nextFalse) errors.push(`[${n.id}] 거짓(FALSE)일 때 다음 노드를 지정하세요`);
    } else if (n.type === 'WAIT_FOR_EVENT') {
      if (!n.nextMatched) errors.push(`[${n.id}] 매칭됐을 때 다음 노드를 지정하세요`);
      if (n.timeoutValue && !n.nextTimeout) errors.push(`[${n.id}] 타임아웃 값을 넣었으면 타임아웃 시 다음 노드도 지정하세요`);
    }
  });
  if (!wf.nodes.some(n => n.type === 'END')) errors.push('END 노드가 최소 1개 필요합니다');
  return errors;
}

function renderFlowPreview() {
  const wf = state.draftWorkflow;
  const edges = computeEdges(wf);
  const lines = [];
  lines.push(`노드 ${wf.nodes.length}개: ` + wf.nodes.map(nodeLabel).join(', '));
  const errors = validateGraphComplete(wf);
  if (errors.length) lines.push('⚠ 저장 전 확인 필요:', ...errors.map(e => `  - ${e}`));
  edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from);
    const to = wf.nodes.find(n => n.id === e.to);
    lines.push(`  ${from ? from.id : e.from} --(${e.route})--> ${to ? to.id : e.to}`);
  });
  wf.nodes.filter(n => n.type === 'CONDITION').forEach(n => lines.push(`  [${n.id}] 조건: ${conditionToText(n.condition)}`));
  wf.nodes.filter(n => n.type === 'WAIT_FOR_EVENT' && n.condition).forEach(n => lines.push(`  [${n.id}] 매칭조건: ${conditionToText(n.condition)}`));
  $('wf_preview').textContent = lines.join('\n');
}

function buildNodeJson(n) {
  const base = { id: n.id, type: n.type };
  if (n.type === 'TRIGGER') return { ...base, eventCode: n.eventCode };
  if (n.type === 'END') return base;
  if (n.type === 'DELAY') return { ...base, duration: { value: Number(n.durationValue || 0), unit: n.durationUnit } };
  if (n.type === 'ACTION') {
    const action = n.actionType === 'ISSUE_COUPON' ? { type: 'ISSUE_COUPON', couponId: n.couponId }
      : { type: n.actionType, templateId: n.templateId };
    return { ...base, action };
  }
  if (n.type === 'WAIT_FOR_EVENT') {
    return { ...base, event: {
      eventCode: n.eventCode,
      timeout: n.timeoutValue ? { value: Number(n.timeoutValue), unit: n.timeoutUnit } : null,
      matchConditions: n.condition ? buildConditionJson(n.condition) : null,
    } };
  }
  if (n.type === 'CONDITION') return { ...base, condition: buildConditionJson(n.condition) };
  return base;
}
function buildConditionJson(c) {
  if (c.type === 'PREDICATE') return { type: 'PREDICATE', field: c.field, operator: c.operator, value: c.value };
  if (c.type === 'NOT') return { type: 'NOT', condition: buildConditionJson(c.condition) };
  return { type: c.type, conditions: (c.conditions || []).map(buildConditionJson) };
}

async function saveWorkflow() {
  const t = requireTenant();
  const wf = state.draftWorkflow;
  if (!wf.triggerEventCode) return toast('트리거 이벤트 코드를 선택하세요.', 'fail');
  if (!wf.id) return toast('워크플로우 ID를 입력하세요.', 'fail');
  const errors = validateGraphComplete(wf);
  if (errors.length) return toast(`저장 전 확인 필요: ${errors[0]}${errors.length > 1 ? ` 외 ${errors.length - 1}건 (흐름 미리보기 참고)` : ''}`, 'fail');
  const definitionJson = {
    trigger: wf.triggerEventCode,
    nodes: wf.nodes.map(buildNodeJson),
    edges: computeEdges(wf).map(e => ({ from: e.from, to: e.to, route: { type: e.route } })),
  };
  await request('POST', '/api/v1/admin/workflows', {
    id: wf.id, tenantId: t, name: wf.name || null, triggerEventCode: wf.triggerEventCode, definitionJson,
  });
  toast(`워크플로우 "${wf.id}" 저장 완료 (DRAFT 상태 — 아래 목록에서 활성화하세요)`, 'ok');
  state.draftWorkflow = newDraftWorkflow();
  renderCurrentTab();
  await loadWorkflows();
}

  const t = tenantId();
  if (!t) return;
  state.workflows = await request('GET', `/api/v1/admin/workflows?${qs({ tenantId: t })}`);
  const box = $('wf_list');
  if (!state.workflows.length) { box.innerHTML = '<div class="empty-msg">등록된 워크플로우가 없습니다.</div>'; }
  else {
    box.innerHTML = `<table><thead><tr><th>ID</th><th>이름</th><th>트리거</th><th>상태</th><th>버전</th><th></th></tr></thead><tbody>
      ${state.workflows.map(w => `<tr>

        <td><span class="badge ${w.status}">${w.status}</span></td><td>${w.version}</td>
        <td>
          ${w.status === 'DRAFT' ? `<button class="small" onclick="enableWorkflow('${escapeHtml(w.id)}')">활성화</button>` : ''}

function refreshWorkflowIdDropdowns() {
  document.querySelectorAll('.workflow-id-select').forEach(sel => {
    const current = sel.value;
    sel.innerHTML = '<option value="">(전체)</option>' + state.workflows.map(w => `<option value="${escapeHtml(w.id)}">${escapeHtml(w.id)} (${escapeHtml(w.name || w.triggerEventCode)})</option>`).join('');
    if (current) sel.value = current;

async function enableWorkflow(id) {
  const t = requireTenant();
  await request('POST', `/api/v1/admin/workflows/${encodeURIComponent(id)}/enable?${qs({ tenantId: t })}`);
  toast(`워크플로우 "${id}" 활성화 완료 — 이제 이벤트 발행 시 실제로 동작합니다.`, 'ok');
  await loadWorkflows();
}

async function deleteWorkflow(id) {
  const t = requireTenant();
  if (!confirm(`워크플로우 "${id}"를 삭제할까요? 되돌릴 수 없습니다.`)) return;
  await request('DELETE', `/api/v1/admin/workflows/${encodeURIComponent(id)}?${qs({ tenantId: t })}`);
  toast(`워크플로우 "${id}" 삭제 완료`, 'ok');
  if (state.draftWorkflow && state.draftWorkflow.id === id) state.draftWorkflow = newDraftWorkflow();
  await loadWorkflows();
}

// definitionJson(서버 저장 포맷: nodes + edges)을 다시 에디터 상태(노드마다 nextAlways/nextTrue/...
// 포인터가 달린 평면 객체)로 되돌린다 - computeEdges()/buildNodeJson()의 역변환.
function fromNodeJson(n) {
  const base = { id: n.id, type: n.type };
  if (n.type === 'TRIGGER') return { ...base, eventCode: n.eventCode };
  if (n.type === 'END') return base;
  if (n.type === 'DELAY') return { ...base, durationValue: n.duration?.value ?? '', durationUnit: n.duration?.unit ?? 'MINUTES' };
  if (n.type === 'ACTION') {
    const a = n.action || {};
    if (a.type === 'ISSUE_COUPON') return { ...base, actionType: 'ISSUE_COUPON', couponId: a.couponId ?? '' };
    return { ...base, actionType: a.type, templateId: a.templateId ?? '' };
  }
  if (n.type === 'WAIT_FOR_EVENT') {
    const ev = n.event || {};
    return {
      ...base, eventCode: ev.eventCode ?? '',
      timeoutValue: ev.timeout?.value ?? '', timeoutUnit: ev.timeout?.unit ?? 'HOURS',
      condition: ev.matchConditions ? JSON.parse(JSON.stringify(ev.matchConditions)) : null,
    };
  }
  if (n.type === 'CONDITION') return { ...base, condition: JSON.parse(JSON.stringify(n.condition)) };
  return base;
}

function loadWorkflowForEdit(id) {
  const wf = state.workflows.find(w => w.id === id);
  if (!wf) return toast('워크플로우를 찾을 수 없습니다. 새로고침 후 다시 시도하세요.', 'fail');
  const def = wf.definitionJson;
  const nodes = def.nodes.map(fromNodeJson);
  def.edges.forEach(e => {
    const node = nodes.find(n => n.id === e.from);
    if (!node) return;
    const prop = { ALWAYS: 'nextAlways', TRUE: 'nextTrue', FALSE: 'nextFalse', MATCHED: 'nextMatched', TIMEOUT: 'nextTimeout' }[e.route.type];
    if (prop) node[prop] = e.to;
  });
  state.draftWorkflow = { id: wf.id, name: wf.name || '', triggerEventCode: wf.triggerEventCode, nodes };
  switchTab('workflow');
  toast(`"${wf.id}" 불러왔습니다 — 수정 후 "워크플로우 저장"을 누르면 같은 id로 덮어씁니다 (상태는 DRAFT로 돌아가니 다시 활성화하세요).`, 'ok');
}

async function publishEvent() {
  const t = requireTenant();
  const eventCode = $('pub_code').value;
  if (!eventCode) return toast('이벤트 코드를 선택하세요.', 'fail');
  const extId = $('pub_extId').value.trim();
  const member = extId ? {
    externalMemberId: extId,
    name: $('pub_name').value.trim() || null,
    email: $('pub_email').value.trim() || null,
    devicePlatform: $('pub_platform').value || null,
    gender: $('pub_gender').value || null,
    birthday: $('pub_birthday').value || null,
  } : null;
  const rawAttrs = readKvRows('pub_attrs');
  const attributes = {};
  Object.entries(rawAttrs).forEach(([k, v]) => { attributes[k] = isNaN(Number(v)) || v === '' ? v : Number(v); });
  await request('POST', '/api/v1/events', { tenantId: t, eventCode, member, attributes });
  toast(`이벤트 "${eventCode}" 발행됨 (202 Accepted) — 비동기 처리되니 잠시 후 인스턴스 탐색 탭을 확인하세요.`, 'ok');

async function loadInstances() {

  if (!state.instances.length) { box.innerHTML = '<div class="empty-msg">인스턴스가 없습니다. 먼저 "5. 이벤트 발행" 탭에서 이벤트를 발행해보세요.</div>'; }
  else {
    box.innerHTML = `<table><thead><tr><th>ID</th><th>워크플로우</th><th>상태</th><th>현재 노드</th><th>대기 중인 이벤트</th><th>대기 만료 시각</th><th>시작 시각</th></tr></thead><tbody>
      ${state.instances.map(i => `<tr class="clickable" onclick="selectInstance('${escapeHtml(i.id)}')">
        <td>${escapeHtml(i.id)}</td><td>${escapeHtml(i.workflowId)}</td>
        <td><span class="badge ${i.status}">${i.status}</span></td>
        <td>${escapeHtml(i.currentNodeId || '-')}</td><td>${escapeHtml(i.waitingEventName || '-')}</td>
        <td>${escapeHtml(i.waitingUntil || '-')}</td><td>${escapeHtml(i.startedAt || '-')}</td>
      </tr>`).join('')}
    </tbody></table>`;
  }
  refreshWorkflowIdDropdowns();
}

async function selectInstance(id) {
  state.selectedInstanceId = id;
  await refreshInstanceDetail();
}

async function refreshInstanceDetail() {
  if (!state.selectedInstanceId) return;
  let view;
  try {
    view = await request('GET', `/api/v1/admin/workflow-instances/${encodeURIComponent(state.selectedInstanceId)}`);
  } catch (e) {
    return; // 404 등은 request()가 이미 toast로 알림
  }
  $('inst_detail_card').style.display = '';
  const inst = view.instance;
  const execs = view.executions || [];
  $('inst_detail').innerHTML = `
    <div class="row">
      <div><b>ID</b><br>${escapeHtml(inst.id)}</div>
      <div><b>상태</b><br><span class="badge ${inst.status}">${inst.status}</span></div>
      <div><b>현재 노드</b><br>${escapeHtml(inst.currentNodeId || '-')}</div>
      <div><b>대기 이벤트</b><br>${escapeHtml(inst.waitingEventName || '-')}</div>
      <div><b>대기 만료</b><br>${escapeHtml(inst.waitingUntil || '-')}</div>
      <div><b>완료 시각</b><br>${escapeHtml(inst.completedAt || '-')}</div>
    </div>
    <h3 style="margin-top:14px">노드 실행 이력 (${execs.length}건)</h3>
    ${execs.length ? `<table><thead><tr><th>노드ID</th><th>타입</th><th>상태</th><th>시작</th><th>종료</th><th>결과</th><th>에러코드</th></tr></thead><tbody>
      ${execs.map(e => `<tr><td>${escapeHtml(e.nodeId)}</td><td>${escapeHtml(e.nodeType)}</td><td><span class="badge ${e.status}">${e.status}</span></td><td>${escapeHtml(e.startedAt || '-')}</td><td>${escapeHtml(e.completedAt || '-')}</td><td>${escapeHtml(e.result || '-')}</td><td>${escapeHtml(e.errorCode || '-')}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty-msg">아직 실행 이력이 없습니다.</div>'}
  `;
}

function onAutoRefreshToggle() {
  if ($('inst_autoRefresh').checked) startPolling(); else stopPolling();
}
function startPolling() {
  stopPolling();
  if (!$('inst_autoRefresh') || !$('inst_autoRefresh').checked) return;
  state.pollTimer = setInterval(async () => {
    await loadInstances();
    await refreshInstanceDetail();
  }, 2000);
}
function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

/* ============================= 탭 렌더링 라우팅 ============================= */

const RENDERERS = {
  eventDef: renderEventDefTab,
  attrDef: renderAttrDefTab,
  member: renderMemberTab,
  workflow: renderWorkflowTab,
  publish: renderPublishTab,
  instance: renderInstanceTab,
};
const AFTER_RENDER = {
  eventDef: loadEventDefinitions,
  attrDef: () => { refreshEventDefSelects(); loadAttributeDefinitions(); },
  member: () => {},
  workflow: () => {
    refreshEventCodeDropdowns();
    // refreshEventCodeDropdowns()는 "이미 선택돼 있던 값"만 보존하는데, 막 불러온 수정 대상 워크플로는
    // DOM이 방금 새로 그려져서 선택값이 비어있다 - state의 값으로 명시적으로 맞춰준다.
    $('wf_triggerCode').value = state.draftWorkflow.triggerEventCode || '';
    renderWorkflowNodesAndEdges();
    loadWorkflows();
  },
  publish: () => refreshEventCodeDropdowns(),
  instance: () => { refreshWorkflowIdDropdowns(); loadInstances(); },
};

let currentTabId = null;
function renderCurrentTab() {
  if (currentTabId) renderTabBody(currentTabId);
}
function renderTabBody(id) {
  $('tab-' + id).innerHTML = RENDERERS[id]();
  if (AFTER_RENDER[id]) AFTER_RENDER[id]();
}

function buildTabContainers() {
  const container = $('tabContainer');
  TABS.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tab-content';
    div.id = 'tab-' + t.id;
    container.appendChild(div);
  });
}

const originalSwitchTab = switchTab;
switchTab = function (id) {
  currentTabId = id;
  originalSwitchTab(id);
  renderTabBody(id);
};

/* ============================= 초기화 ============================= */

renderTabsNav();
buildTabContainers();
refreshFieldSuggestions();
switchTab('eventDef');
$('tenantId').addEventListener('change', saveTenant);
</script>
</body>
</html>

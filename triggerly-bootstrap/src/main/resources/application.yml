spring:
  application:
    name: triggerly-claude
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Spring Boot 4.1은 기본적으로 신규 Jackson 3(tools.jackson) 기반 컨버터를 HTTP 메시지 변환에
  # 우선 사용한다. 이 프로젝트의 DTO/도메인 클래스는 전부 고전 Jackson 2(com.fasterxml.jackson)
  # 애노테이션과 jackson-module-kotlin(2.x)을 전제로 작성되어 있어, Jackson 3 컨버터가 Kotlin
  # data class의 생성자를 인식하지 못해 "no Creators" 역직렬화 예외가 발생함을 실측 확인
  # (예: POST /api/v1/events의 EventRequestDto). 고전 Jackson2 컨버터를 사용하도록 명시한다.
  http:
    converters:
      preferred-json-mapper: jackson2

server:
  tomcat:
    max-swallow-size: 2MB

triggerly:
  kafka:
    raw-events-topic:
      partitions: 32
    consumer:
      concurrency: 8
      max-poll-records: 500
    action-dispatch-topic:
      partitions: 16
    action-dispatch:
      consumer:
        # raw-events 수집(concurrency 8)과 완전히 분리된 스레드 풀 - 프로바이더 API 호출 대기가
        # 대부분이라 CPU 코어 수와 무관하게 넉넉히 잡는다.
        concurrency: 16
  ratelimit:
    default-rps: 2000
  async:
    member-sync:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 1000
  scheduler:
    timeout-poll-interval-ms: 10000
    event-instance-retention-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
